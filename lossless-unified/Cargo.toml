[package]
name = "lossless-unified"
version = "3.0.0"
edition = "2021"
description = "Ultimate Unified Lossless FLAC Music Plugin - Combines all APIs (Qobuz, Tidal, Deezer, SoundCloud) with parallel search, quality ranking, Dolby Atmos support, and advanced features. Uses actual Lossless FLAC and Monochrome credentials."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bex-core = { path = "../universal-downloader/bex-core", features = ["resolver"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json", "cookies", "stream"] }
tokio = { version = "1.0", features = ["full"] }
base64 = "0.21"
hex = "0.4"
urlencoding = "2.1"
lazy_static = "1.4"
chrono = "0.4"
md-5 = "0.10"
sha2 = "0.10"
aes = "0.8"
blowfish = "0.9"
rand = { version = "0.8", features = ["js"] }
hmac = "0.12"
regex = "1.10"
bytes = "1.5"
futures-util = "0.3"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[package.metadata.component]
package = "component:content-resolver"

[package.metadata.component.dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false