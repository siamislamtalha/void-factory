[package]
name = "universal-downloader"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bex-core = { path = "./bex-core", features = ["resolver"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json", "gzip", "brotli", "deflate"] }
tokio = { version = "1.0", features = ["full"] }
base64 = "0.21"
hex = "0.4"
des = "0.8"
lazy_static = "1.4"

[package.metadata.component]
package = "component:content-resolver"

[package.metadata.component.dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false
